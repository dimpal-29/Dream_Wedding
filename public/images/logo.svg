<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 355 70">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap');
      .brand-title {
        font-family: 'Playfair Display', Georgia, 'Palatino Linotype', 'Book Antiqua', serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
    </style>
  </defs>

  <!-- Elegant Pink Heart Icon -->
  <path d="M25 25 C30 20, 45 20, 50 35 C55 20, 70 20, 75 25 C80 30, 80 45, 50 65 C20 45, 20 30, 25 25" 
        fill="#ff4d6d" />
  <circle cx="45" cy="40" r="10" fill="none" stroke="white" stroke-width="1.5" opacity="0.6" />
  <circle cx="55" cy="42" r="10" fill="none" stroke="white" stroke-width="1.5" opacity="0.6" />
  
  <!-- Text: Dream (Red) Wedding (Yellow/Gold) -->
  <text x="82" y="49" class="brand-title">
    <tspan fill="#ff4b2b">Dream</tspan><tspan fill="#ffb037">Wedding</tspan>
  </text>
  
  <!-- Multi-color line -->
  <rect x="82" y="56" width="84" height="2.5" fill="#ff4b2b" rx="1.25" />
  <rect x="168" y="56" width="120" height="2.5" fill="#ffb037" rx="1.25" />
</svg>
